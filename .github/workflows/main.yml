name: "Main CI"

on:
  push:
  workflow_dispatch:

jobs:

  config:
    name: "Config: Compute values used in workflow"
    uses: ./.github/workflows/config.yml

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    needs:
      - config
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ needs.config.outputs.python-version }}
      - name: "Lint"
        run: make lint
      - name: "Coverage pragmas"
        run: python3 scripts/check_pragmas.py

  test:
    name: "Test: Python ${{ matrix.python-version }}, Plone ${{ matrix.plone-version }}"
    runs-on: ubuntu-latest
    needs:
      - config
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        plone-version: ['6.2-latest', '6.1-latest']
        exclude:
          # Plone 6.1 supports Python up to 3.13.
          - python-version: '3.14'
            plone-version: '6.1-latest'
    env:
      PLONE_VERSION: ${{ matrix.plone-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: "Install"
        run: make install
      - name: "Test"
        run: make test

  coverage:
    name: "Test coverage"
    runs-on: ubuntu-latest
    needs:
      - config
    env:
      PLONE_VERSION: ${{ needs.config.outputs.plone-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ needs.config.outputs.python-version }}
      - name: "Install"
        run: make install
      - name: "Test with coverage"
        run: make test-coverage

  docker:
    name: "Test against Redis and Valkey"
    runs-on: ubuntu-latest
    needs:
      - config
    env:
      PLONE_VERSION: ${{ needs.config.outputs.plone-version }}
      # Fail instead of skipping when Docker is missing: here a skip would
      # hide the one run that checks real servers.
      REDIS_MEMOIZE_REQUIRE_DOCKER: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ needs.config.outputs.python-version }}
      - name: "Install"
        run: make install
      - name: "Test against containers"
        run: make test-docker

  docs:
    name: "Documentation"
    runs-on: ubuntu-latest
    needs:
      - config
    # Always on main: the published site must follow every merge.
    if: ${{ needs.config.outputs.docs == 'true' || github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.14'
      - name: "Build, warnings as errors"
        run: make docs-html
      - name: "Vale"
        run: make docs-vale
      - name: "Upload the site for GitHub Pages"
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html/

  deploy-docs:
    name: "Deploy documentation"
    # Only from main, and only when every other job succeeded.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - coverage
      - docker
      - docs
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - lint
      - test
      - coverage
      - docker
      - docs
      - deploy-docs
    steps:
      - name: Report
        shell: bash
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| Config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Lint | ${{ needs.lint.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Test | ${{ needs.test.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Coverage | ${{ needs.coverage.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Docker | ${{ needs.docker.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Docs | ${{ needs.docs.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| Deploy docs | ${{ needs.deploy-docs.result }} |' >> $GITHUB_STEP_SUMMARY
